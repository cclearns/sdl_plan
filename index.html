<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Build your own six-week English learning plan, step by step, and download it as an editable Word file.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>My 6-Week English Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one narrow notebook column; a numbered step rail on top, one step on screen, a sticky Back/Next bar below. */
:root{
  --paper:#F3F6FA; --surface:#FFFFFF; --ink:#1A2233; --muted:#566074; --line:#D3DAE6;
  --indigo:#2A4A9A; --indigo-soft:#E5ECF9; --on-indigo:#FFFFFF;
  --marker:#FFE36E; --ok:#1B7A58; --warn:#9A520A; --warn-soft:#FFF3DC;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#11151D; --surface:#19202C; --ink:#E7ECF4; --muted:#9CA7BA; --line:#2E3849;
  --indigo:#9AB6FF; --indigo-soft:#1F2B47; --on-indigo:#0E1524;
  --marker:#5E4E06; --ok:#5FD0A4; --warn:#F2B25C; --warn-soft:#33270F; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#19202C; --ink:#E7ECF4; --muted:#9CA7BA; --line:#2E3849;
  --indigo:#9AB6FF; --indigo-soft:#1F2B47; --on-indigo:#0E1524;
  --marker:#5E4E06; --ok:#5FD0A4; --warn:#F2B25C; --warn-soft:#33270F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:740px;margin:0 auto;padding-inline:16px;padding-block:20px 0;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.15rem;font-weight:700}
h2{font-size:1.7rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top small{color:var(--muted);font-size:.85rem}
.rail{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.rail li{flex:1;min-width:0}
.rail button{width:100%;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:5px;align-items:flex-start;color:var(--muted);font-size:.74rem;text-align:left}
.rail .bar{height:6px;width:100%;border-radius:3px;background:var(--line)}
.rail .done .bar{background:var(--indigo);opacity:.45}
.rail .now .bar{background:var(--indigo)}
.rail .now{color:var(--ink);font-weight:700}
.rail span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:620px){ .rail span.t{display:none} }

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;display:flex;flex-direction:column;gap:22px}
@media (max-width:480px){ .sheet{padding:20px 16px} h2{font-size:1.45rem} }
.kicker{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--indigo);font-weight:700}
.lead{color:var(--muted);max-width:62ch}
mark{background:var(--marker);color:var(--ink);padding:0 .2em;border-radius:3px}
.free{background:var(--indigo-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.free ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label,.qlabel{font-weight:700}
.hint{color:var(--muted);font-size:.9rem}
input[type=text],input[type=date],input[type=number],textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{border-color:var(--indigo)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.93rem;text-align:left;line-height:1.3}
.chip:hover{border-color:var(--indigo)}
.chip[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
details.ideas summary{cursor:pointer;color:var(--indigo);font-weight:700;font-size:.93rem}
details.ideas .chips{margin-top:8px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.card b{font-family:var(--display)}
.card span{color:var(--muted);font-size:.88rem}
.card[aria-pressed=true]{border-color:var(--indigo);background:var(--indigo-soft)}

.total{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.total b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.note{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:10px 14px;border-radius:4px;font-size:.95rem}

.smart{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.smart h3 i{font-style:normal;display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:6px;background:var(--indigo);color:var(--on-indigo);margin-right:8px}
.yn{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 0}
.yn p{min-width:0;font-size:.97rem}
.seg{display:flex;flex:none;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 13px;cursor:pointer;font-size:.9rem}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed=true][data-v=y]{background:var(--ok);color:var(--surface)}
.seg button[aria-pressed=true][data-v=n]{background:var(--warn);color:var(--surface)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.9rem;font-variant-numeric:tabular-nums}
.tabs button[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.act{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.act.fixed{background:var(--indigo-soft);border-color:transparent}
.act .n{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}

dl.sum{margin:0;display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 16px}
dl.sum dt{color:var(--muted);font-size:.9rem}
dl.sum dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){ dl.sum{grid-template-columns:1fr;gap:2px} dl.sum dd{margin-bottom:8px} }
.empty{color:var(--muted);font-style:italic}

.btn{border:1.5px solid var(--indigo);background:var(--indigo);color:var(--on-indigo);border-radius:8px;padding:11px 20px;cursor:pointer;font-weight:700;min-height:46px}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn.link{border:0;background:none;color:var(--indigo);padding:6px 0;min-height:0;text-decoration:underline;font-weight:400}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:.95rem;min-height:1.5em}
.nav{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:10px;align-items:center}
.nav .count{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
#copyout{font-size:.85rem;min-height:180px}
@media (prefers-reduced-motion:no-preference){ .chip,.card,.btn{transition:background-color .12s,border-color .12s} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>My 6-Week English Plan</h1>
    <small id="savednote">Your answers are saved on this device.</small>
  </header>
  <nav aria-label="Steps"><ol class="rail" id="rail"></ol></nav>
  <main class="sheet" id="main" tabindex="-1"></main>
  <div class="nav">
    <button class="btn ghost" id="back" type="button">Back</button>
    <span class="count" id="count"></span>
    <button class="btn" id="next" type="button">Next</button>
  </div>
</div>

<script src="jszip.min.js"></script>

function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var START="2026-10-22";
var D={theme:THEME_DEFAULT};

function v(k){if(k==="start")return START;return S[k]!=null?S[k]:(D[k]||"")}
function gt(){return GT[S.gtype]?S.gtype:"other"}
function pdate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function fmt(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekRange(n){var s=pdate(v("start"));if(!s)return "";return fmt(addDays(s,7*(n-1)))+" to "+fmt(addDays(s,7*n-1))}
function endDate(){var s=pdate(v("start"));return s?fmt(addDays(s,41)):""}
function startDate(){var s=pdate(v("start"));return s?fmt(s):""}
function num(k){var n=parseInt(S[k],10);return isFinite(n)&&n>0?n:0}
function timeLine(){var d=num("days"),m=num("mins");if(!d||!m)return "";return m+" minutes a day, "+d+" day"+(d>1?"s":"")+" a week ("+(d*m)+" minutes a week)"}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function list(s){return String(s||"").split(",").map(function(x){return x.trim()}).filter(Boolean)}
function chipsHTML(k,arr,multi){var cur=v(k),items=list(cur);

function live(){

  var t=document.querySelector('[data-live="total"]');
  if(t){var d=num("days"),m=num("mins"),h="";
    if(d&&m){h='<div class="total"><span><b>'+(d*m)+'</b> minutes each week</span><span><b>'+(d*m*6)+'</b> minutes in six weeks</span></div>';
      if(d>=7||d*m>300)h+='<p class="note">This is a big plan. Last semester, many students wrote that studying every day was too difficult. Can you keep this in your busiest week? If you are not sure, choose fewer days.</p>';}
    t.innerHTML=h}
  SMART.forEach(function(g){var el=document.querySelector('[data-live="tip'+g.k+'"]');if(!el)return;var no=false;g.items.forEach(function(_,i){if(S["c"+g.k+i]==="n")no=true});
    var h=no?'<p class="note">'+esc(g.tip)+'</p>':"";
    if(g.k==="M"&&v("draft")&&!/\d/.test(v("final")||v("draft")))h+='<p class="note">I cannot find a number in your goal yet. Add minutes, words, pages, times, or a score.</p>';
    el.innerHTML=h});
}
function render(focus){
  var m=document.getElementById("main");m.innerHTML=R[step]();
  document.getElementById("rail").innerHTML=STEPS.map(function(s,i){return '<li class="'+(i===step?"now":i<step?"done":"")+'"><button type="button" data-step="'+i+'"'+(i===step?' aria-current="step"':'')+' aria-label="Step '+(i+1)+': '+s+'"><span class="bar"></span><span class="t">'+(i+1)+'. '+s+'</span></button></li>'}).join("");
  document.getElementById("back").disabled=step===0;
  var nx=document.getElementById("next");nx.hidden=step===STEPS.length-1;nx.textContent=step===0?"Start":"Next";
  document.getElementById("count").textContent=(step+1)+" / "+STEPS.length;

}
function go(i){step=Math.min(Math.max(i,0),STEPS.length-1);S._step=step;save();render(true)}

document.getElementById("back").addEventListener("click",function(){go(step-1)});
document.getElementById("next").addEventListener("click",function(){go(step+1)});

main.addEventListener("input",function(e){var k=e.target.dataset.k;if(!k)return;S[k]=e.target.value;save();

function syncChips(box,k){var multi=box.dataset.multi,cur=String(S[k]==null?"":S[k]),items=list(cur);
  box.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",multi?items.indexOf(c.dataset.val)>=0:cur===c.dataset.val)})}
var resetArmed=false;
main.addEventListener("click",function(e){
  var c=e.target.closest(".chip");
  if(c){var box=c.parentNode,k=box.dataset.for,val=c.dataset.val;
    if(box.dataset.multi){var it=list(S[k]),ix=it.indexOf(val);if(ix>=0)it.splice(ix,1);else it.push(val);S[k]=it.join(", ")}

    var inp=document.getElementById("f-"+k);if(inp)inp.value=S[k];save();syncChips(box,k);live();return}
  var card=e.target.closest("[data-card]");

  else if(act==="copyweek"){for(var i=2;i<=6;i++)["a2","a3","when","check"].forEach(function(f){if(!S["w"+i+f])S["w"+i+f]=S["w1"+f]||""});save();render(false);a=main.querySelector('[data-act="copyweek"]');if(a)a.textContent="Copied to empty weeks"}
